name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: http://localhost:3001/api
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # Structural FSD checks the import linter cannot see.
      - run: npm run lint:fsd
      # Both languages must carry the same keys, or half the users see raw keys.
      - run: npm run check:i18n
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
